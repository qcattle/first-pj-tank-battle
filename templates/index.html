<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>坦克大战</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <span>分数 <b id="score">0</b></span>
      <span>生命 <b id="lives">3</b></span>
      <span>剩余敌人 <b id="left">10</b></span>
    </div>

    <canvas id="game"></canvas>

    <!-- 排行榜按钮（游戏结束时出现） -->
    <button id="leaderboard-btn" class="ui-btn" style="display:none;">🏆 查看排行榜</button>

    <!-- 排行榜弹窗 -->
    <div id="leaderboard-modal" class="modal hidden">
      <div class="modal-content">
        <h2>🏆 游客排行榜</h2>
        <ul id="leaderboard-list"></ul>
        <button id="close-modal-btn" class="ui-btn">关闭</button>
      </div>
    </div>

    <!-- 输入名字弹窗 -->
    <div id="name-input-modal" class="modal hidden">
      <div class="modal-content">
        <h2>🎉 你的分数是 <span id="final-score">0</span></h2>
        <p style="margin: 10px 0; font-size: 14px; color: #94a3b8;">请输入你的名字保存到排行榜：</p>
        <input type="text" id="player-name-input" maxlength="10" placeholder="游客" value="游客">
        <button id="save-score-btn" class="ui-btn" style="margin-top: 15px;">保存分数</button>
      </div>
    </div>

    <div class="tip">方向键 移动 · 空格 射击 · R 重新开始</div>
  </div>

  <!-- 触屏虚拟摇杆 -->
  <div class="touch-controls" id="touchControls">
    <div class="dpad">
      <button class="dpad-btn" data-dir="up" aria-label="上">▲</button>
      <div class="dpad-row">
        <button class="dpad-btn" data-dir="left" aria-label="左">◀</button>
        <div class="dpad-center"></div>
        <button class="dpad-btn" data-dir="right" aria-label="右">▶</button>
      </div>
      <button class="dpad-btn" data-dir="down" aria-label="下">▼</button>
    </div>
    <div class="action-btns">
      <button class="fire-btn" id="fireBtn" aria-label="射击">🔥</button>
      <button class="restart-btn" id="restartBtn" aria-label="重新开始">↻</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
